# Regras de roteamento UBS/UPA - Niteroi (IBGE 330330)
# So avaliadas DEPOIS que nenhum sinal de alerta (ver sinais_alerta.yaml) for positivo.
# status: pendente_revisao em TODAS as linhas ate profissional de saude validar.
#
# Ver DISCORDANCIAS.md para conflitos entre fontes e qual leitura foi adotada.
# Qualquer sintoma que nao se encaixe nas regras abaixo cai no default conservador
# do motor (ver app/rules/engine.py): na duvida, orienta procurar urgencia/192 -
# nunca UBS por omissao, e o LLM nunca decide isso.

regras:
  - id: febre_sem_complicacao
    condicao:
      sintoma: febre
      febre_acima_39: false
      sinais_alerta: false
    destino: ubs
    fonte: cab28-v2
    status_revisao: pendente_revisao

  - id: febre_acima_39
    condicao:
      sintoma: febre
      febre_acima_39: true
      sinais_alerta: false
    destino: upa
    fonte: sp-quando-upa
    status_revisao: pendente_revisao

  - id: vomito_persistente
    condicao:
      sintoma: vomito
      sinais_alerta: false
    destino: upa
    fonte: sp-quando-upa
    status_revisao: pendente_revisao

  - id: diarreia_com_dor_aguda
    condicao:
      sintoma: diarreia
      dor_aguda: true
      sinais_alerta: false
    destino: upa
    fonte: sp-quando-upa
    status_revisao: pendente_revisao

  - id: sangramento_ou_corte_profundo
    condicao:
      sintoma: corte_ou_sangramento
      profundo_ou_nao_controlado: true
      sinais_alerta: false
    destino: upa
    fonte: sp-quando-upa
    status_revisao: pendente_revisao

  - id: fratura_ou_luxacao
    condicao:
      sintoma: trauma
      tipo: [fratura, luxacao]
      sinais_alerta: false
    destino: upa

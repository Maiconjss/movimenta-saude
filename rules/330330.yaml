  - id: colica_renal
    condicao:
      sintoma: colica_renal
      sinais_alerta: false
    destino: upa
    fonte: sp-quando-upa
    status_revisao: pendente_revisao

  - id: crise_asmatica_leve_moderada
    condicao:
      sintoma: crise_asmatica
      intensidade: [leve, moderada]
      sinais_alerta: false
    destino: ubs
    fonte: cab28-v2
    status_revisao: pendente_revisao

  - id: gestante_dor_abdominal_leve
    condicao:
      sintoma: dor_abdominal
      gestante: true
      sinais_alerta: false
    destino: ubs
    fonte: cab28-v2
    status_revisao: pendente_revisao

  - id: resfriado_gripe_sem_complicacao
    condicao:
      sintoma: resfriado_gripe
      sinais_alerta: false
    destino: ubs
    fonte: einstein-quando-ps
    status_revisao: pendente_revisao

  - id: corte_pequeno_sem_sutura
    condicao:
      sintoma: corte_pequeno
      sinais_alerta: false
    destino: ubs
    fonte: einstein-quando-ps
    status_revisao: pendente_revisao

  - id: dor_garganta_sem_febre_alta
    condicao:
      sintoma: dor_garganta
      febre_alta: false
      sinais_alerta: false
    destino: ubs
    fonte: einstein-quando-ps
    status_revisao: pendente_revisao

  - id: dor_cabeca_leve
    condicao:
      sintoma: dor_cabeca
      intensidade: leve
      persistente: false
      sinais_alerta: false
